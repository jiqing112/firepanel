# FirePanel 配置文件示例
# 复制为 config.yaml 放在 firepanel 二进制同目录（或用 -config 指定路径），
# 未指定 -config 时程序会自动探测加载。命令行参数优先级高于本文件。

server:
  # 面板 HTTP 监听地址
  listen: ":8088"

  # 数据目录（SQLite 与证书）
  data_dir: "/opt/firepanel/data"

  # 反向代理监听。三种部署形态：
  #   1) 直接占用 80/443：保持默认，面板内置引擎做入口反代
  #      proxy_http: ":80"
  #      proxy_https: ":443"
  #   2) 占用非 80/443 端口（80/443 留给其他服务）：改成自定义端口即可
  #      proxy_http: ":8180"
  #      proxy_https: ":8143"
  #   3) 交给 Caddy 托管（见下方 proxy 段）：面板经 Admin API 下发配置，
  #      由 Caddy 占用 80/443 或任意端口做反代，面板自身不监听反代端口
  proxy_http: ":80"
  proxy_https: ":443"

  # ── 面板自身 HTTPS ─────────────────────────────────────────────
  # 填公网 IP 或域名：启动时自动向 Let's Encrypt 签发证书并应用
  #   · IP  → shortlived 短期证书（约 6.7 天有效期，全自动续期）
  #   · 域名 → 常规 90 天证书，自动续期
  # 要求该地址可从公网 80/443 访问（ACME 校验）。
  # panel_https: "203.0.113.9"
  panel_https: ""

  # 面板 HTTPS 监听端口
  panel_https_port: ":8443"

  # 手动证书模式（优先于 panel_https 的自动签发）：
  # 填证书/私钥文件路径（内网 IP 用面板「反向代理→自签证书」生成后保存为文件）
  panel_tls_cert: ""
  panel_tls_key: ""

  # ── 面板整站 Basic Auth ────────────────────────────────────────
  # 应用层登录之外的额外防护层，覆盖全部页面与 API（含 WebSocket）。
  # 两项都非空即启用；浏览器首次访问弹出账号密码框。
  # 建议将本文件权限设为 600：chmod 600 config.yaml
  basic_auth_user: ""
  basic_auth_pass: ""

  # SSH 保护端口（涉及这些端口的变更会触发高危确认流程）
  ssh_ports: [22]

firewall:
  # 防火墙后端：auto（探测 nftables → iptables）| iptables | nftables
  backend: "auto"

sync:
  # 内核漂移检测周期
  drift_interval: 30s
  # 流量采样周期（WebSocket 推送间隔）
  stats_interval: 5s
  # 危险变更延时生效时长
  danger_delay: 60s
  # 危险变更确认窗口（超时自动回滚）
  confirm_window: 90s

logging:
  level: "info"

# ── 反向代理实现选择 ────────────────────────────────────────────
# backend:
#   builtin  面板内置反代引擎（默认）：自动证书（含 Let's Encrypt IP 证书）、
#            健康检查、路径路由全部由面板管理，监听上面的 proxy_http/proxy_https
#   caddy    托管给本机 Caddy：面板把域名/路由/上游配置经 Admin API 下发给
#            Caddy（需已安装并运行 Caddy，且 caddy_admin 可达）。证书由 Caddy
#            的 automatic HTTPS 管理（IP 证书需 Caddy ≥ 2.10）；面板自身 HTTPS
#            仍由面板内置 certmagic 管理，不受此开关影响
# 注意：caddy 模式下请让 Caddy 独占该 Caddy 实例的配置管理（/load 为整配置替换）
proxy:
  backend: "builtin"
  caddy_admin: "http://127.0.0.1:2019"

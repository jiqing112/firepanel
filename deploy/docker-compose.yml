
# FirePanel 容器化部署
#
# 必须使用 host 网络：防火墙面板要在「宿主机」的 netns 里创建 iptables/nft 规则
# 并监听 80/443。默认 bridge 网络下容器有独立 netns，面板规则只作用于容器自身、
# 80/443 也只是 Docker 端口映射，宿主防火墙完全不受管理（功能形同虚设）。
#
# pid: host 让容器内 ss 能看到宿主机进程（端口台账/连接级流量的进程与 PID 归属）。
# 因此容器实际以宿主机 root 权限运行 —— 这是管理内核防火墙的必要条件。
services:
  firepanel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: firepanel
    restart: unless-stopped
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:18088/api/v1/bootstrap"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

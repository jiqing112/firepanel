version: "3.8"

# FirePanel 容器化部署
# 注意：容器需要操作宿主 netfilter，必须授予 NET_ADMIN（或 --privileged）。
# 反代的 80/443 若与宿主服务冲突，请改映射端口并用 -proxy-http/-proxy-https 调整监听。
services:
  firepanel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: firepanel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # 如需 IPTABLES 原生路径（CENTOS7 老内核）可改 privileged: true
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"   # 面板
      - "80:80"       # 反代 HTTP（含 ACME HTTP-01）
      - "443:443"     # 反代 HTTPS
    environment:
      - TZ=Asia/Shanghai
